<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理｜迷你列印の小商店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iansui&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #FFD3E0;
    --pink-deep: #FF9EB8;
    --blue: #C9E4FF;
    --blue-deep: #8FC4FF;
    --yellow: #FFF0B0;
    --yellow-deep: #FFDD6B;
    --purple: #E3D4FF;
    --purple-deep: #C4A6FF;
    --cream: #FFFBF5;
    --ink: #5B4B6A;
    --ink-soft: #8A7A97;
    --white: #FFFFFF;
    --radius-lg: 28px;
    --radius-md: 18px;
    --shadow-soft: 0 12px 30px rgba(180, 150, 200, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }
  h1, h2, h3, .logo, .btn { font-family: 'Iansui', 'Noto Sans TC', sans-serif; font-weight: 400; }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn {
    font-family: 'Iansui', 'Noto Sans TC', sans-serif;
    padding: 11px 24px;
    border-radius: 999px;
    font-size: 0.92rem;
    cursor: pointer;
    border: none;
  }
  .btn-primary { background: var(--pink-deep); color: white; box-shadow: 0 6px 16px rgba(255,158,184,0.4); }
  .btn-outline { background: white; border: 2px solid var(--purple-deep); color: var(--ink); }
  .btn-danger { background: #FCE4E9; color: #C13E5E; font-size: 0.8rem; padding: 7px 16px; }
  .btn-sm { font-size: 0.82rem; padding: 7px 16px; }

  /* ---- login screen ---- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 44px 38px;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow-soft);
    text-align: center;
  }
  .login-card .logo-mark { width: 56px; height: 56px; margin: 0 auto 14px; }
  .login-card h1 { font-size: 1.6rem; margin-bottom: 6px; }
  .login-card p.sub { color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 26px; }
  .login-card input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1.5px solid rgba(139,122,151,0.25);
    background: var(--cream);
    font-size: 0.92rem;
    margin-bottom: 12px;
    font-family: 'Noto Sans TC';
  }
  .login-card input:focus { outline: none; border-color: var(--pink-deep); }
  .btn-login {
    width: 100%;
    padding: 13px;
    border-radius: 999px;
    background: var(--pink-deep);
    color: white;
    font-size: 1rem;
    box-shadow: 0 8px 22px rgba(255, 158, 184, 0.45);
    margin-top: 8px;
  }
  .login-error { color: #E0567A; font-size: 0.85rem; margin-top: 12px; min-height: 18px; }

  /* ---- dashboard ---- */
  .dash { display: none; }
  .dash.show { display: block; }

  header.dash-head {
    background: rgba(255,251,245,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid rgba(227,212,255,0.5);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .dash-head-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .dash-head-inner .logo { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; }
  .dash-head-inner .logo-mark { width: 34px; height: 34px; }
  .btn-logout {
    background: var(--white);
    border: 2px solid var(--purple-deep);
    color: var(--ink);
    padding: 9px 20px;
    border-radius: 999px;
    font-size: 0.88rem;
  }
  .btn-logout:hover { background: var(--purple); }

  .dash-body { max-width: 1100px; margin: 0 auto; padding: 30px 26px 80px; }

  .tabs { display: flex; gap: 10px; margin-bottom: 26px; }
  .tab-btn {
    background: var(--white);
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 0.92rem;
    color: var(--ink-soft);
    box-shadow: 0 4px 12px rgba(180,150,200,0.1);
  }
  .tab-btn.active { background: var(--ink); color: white; }
  .tab-btn .count {
    display: inline-block;
    background: rgba(255,255,255,0.25);
    padding: 1px 8px;
    border-radius: 999px;
    margin-left: 6px;
    font-size: 0.78rem;
  }
  .tab-btn:not(.active) .count { background: var(--pink); color: var(--ink); }

  .panel { display: none; }
  .panel.active { display: block; }

  .empty-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--ink-soft);
  }

  .order-card {
    background: var(--white);
    border-radius: var(--radius-md);
    padding: 24px 26px;
    margin-bottom: 18px;
    box-shadow: 0 6px 18px rgba(180,150,200,0.12);
  }
  .order-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .order-time { font-size: 0.8rem; color: var(--ink-soft); }
  .order-customer { font-size: 1.05rem; font-family: 'Noto Sans TC'; font-weight: 700; }
  .order-contact { font-size: 0.88rem; color: var(--ink-soft); margin-top: 2px; }

  .status-select {
    font-family: 'Noto Sans TC';
    font-size: 0.82rem;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1.5px solid rgba(139,122,151,0.25);
    background: var(--cream);
    color: var(--ink);
  }
  .status-select.done { background: var(--blue); border-color: var(--blue-deep); }
  .status-select.replied { background: var(--blue); border-color: var(--blue-deep); }

  .order-items { border-top: 1px dashed rgba(139,122,151,0.25); padding-top: 12px; margin-top: 4px; }
  .order-item-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    padding: 4px 0;
  }
  .order-item-row .name { color: var(--ink); }
  .order-item-row .amt { color: var(--ink-soft); }

  .order-total {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-family: 'Noto Sans TC';
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(139,122,151,0.25);
  }
  .order-total .amt { color: var(--pink-deep); }

  .order-extra {
    margin-top: 12px;
    font-size: 0.86rem;
    color: var(--ink-soft);
  }
  .order-extra div { margin-bottom: 3px; }
  .order-extra b { color: var(--ink); font-weight: 700; }

  .inquiry-desc {
    background: var(--cream);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.9rem;
    margin: 10px 0;
  }

  .badge-new {
    display: inline-block;
    background: var(--yellow-deep);
    color: var(--ink);
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 700;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* ---- product management ---- */
  .product-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }

  .product-card {
    background: var(--white);
    border-radius: var(--radius-md);
    padding: 18px 22px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 6px 18px rgba(180,150,200,0.1);
  }
  .product-card.inactive { opacity: 0.5; }
  .product-icon { font-size: 2rem; width: 52px; text-align: center; flex-shrink: 0; }
  .product-info { flex: 1; min-width: 0; }
  .product-name { font-size: 1.02rem; font-weight: 700; font-family: 'Noto Sans TC'; }
  .product-price { color: var(--pink-deep); font-weight: 700; font-size: 0.92rem; margin-left: 8px; }
  .product-desc { font-size: 0.82rem; color: var(--ink-soft); margin-top: 2px; }
  .product-options { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }
  .product-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .pf-overlay {
    position: fixed; inset: 0;
    background: rgba(91,75,106,0.4);
    display: none;
    align-items: center; justify-content: center;
    z-index: 500;
    padding: 20px;
  }
  .pf-overlay.open { display: flex; }
  .pf-card {
    background: var(--cream);
    border-radius: var(--radius-lg);
    max-width: 480px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    padding: 30px 30px 24px;
  }
  .pf-card h3 { margin-bottom: 20px; }
  .pf-field { margin-bottom: 14px; }
  .pf-field label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; font-family: 'Noto Sans TC'; }
  .pf-field input, .pf-field textarea {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1.5px solid rgba(139,122,151,0.25);
    background: white;
    font-family: 'Noto Sans TC';
    font-size: 0.9rem;
  }
  .pf-field .pf-hint { font-size: 0.76rem; color: var(--ink-soft); margin-top: 4px; }
  .pf-field.checkbox { display: flex; align-items: center; gap: 8px; }
  .pf-field.checkbox label { margin-bottom: 0; }
  .pf-actions { display: flex; gap: 10px; margin-top: 18px; }
  .pf-actions .btn { flex: 1; }

  /* ---- customer message threads ---- */
  .thread-card {
    background: var(--white);
    border-radius: var(--radius-md);
    padding: 18px 22px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 6px 18px rgba(180,150,200,0.1);
    cursor: pointer;
  }
  .thread-card:hover { box-shadow: var(--shadow-soft); }
  .thread-email { font-size: 0.98rem; font-weight: 700; font-family: 'Noto Sans TC'; }
  .thread-preview { font-size: 0.85rem; color: var(--ink-soft); margin-top: 3px; max-width: 480px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-time { font-size: 0.76rem; color: var(--ink-soft); flex-shrink: 0; }

  .admin-bubble {
    max-width: 78%;
    padding: 10px 15px;
    border-radius: 16px;
    font-size: 0.88rem;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-line;
  }
  .admin-bubble.from-customer {
    align-self: flex-start;
    background: var(--cream);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .admin-bubble.from-shop {
    align-self: flex-end;
    background: var(--pink-deep);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .admin-bubble .chat-time { display: block; font-size: 0.68rem; opacity: 0.65; margin-top: 4px; }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <svg class="logo-mark" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="24" fill="#FFD3E0"/>
      <path d="M14 30V20L24 14L34 20V30L24 36L14 30Z" stroke="#5B4B6A" stroke-width="2" stroke-linejoin="round" fill="#FFF3B8"/>
      <path d="M14 20L24 26L34 20" stroke="#5B4B6A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M24 26V36" stroke="#5B4B6A" stroke-width="2"/>
    </svg>
    <h1>後台登入</h1>
    <p class="sub">迷你列印の小商店・訂單管理</p>
    <input type="email" id="loginEmail" placeholder="管理員 Email">
    <input type="password" id="loginPassword" placeholder="密碼">
    <button class="btn btn-login" id="loginBtn">登入</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dash">
  <header class="dash-head">
    <div class="dash-head-inner">
      <div class="logo">
        <svg class="logo-mark" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="24" fill="#FFD3E0"/>
          <path d="M14 30V20L24 14L34 20V30L24 36L14 30Z" stroke="#5B4B6A" stroke-width="2" stroke-linejoin="round" fill="#FFF3B8"/>
          <path d="M14 20L24 26L34 20" stroke="#5B4B6A" stroke-width="2" stroke-linejoin="round"/>
          <path d="M24 26V36" stroke="#5B4B6A" stroke-width="2"/>
        </svg>
        訂單後台
      </div>
      <button class="btn-logout" id="logoutBtn">登出</button>
    </div>
  </header>

  <div class="dash-body">
    <div class="tabs">
      <button class="tab-btn active" id="tabOrders">購物車訂單 <span class="count" id="ordersCount">0</span></button>
      <button class="tab-btn" id="tabInquiries">客製詢價 <span class="count" id="inquiriesCount">0</span></button>
      <button class="tab-btn" id="tabProducts">商品管理 <span class="count" id="productsCount">0</span></button>
      <button class="tab-btn" id="tabMessages">顧客訊息 <span class="count" id="messagesCount">0</span></button>
    </div>

    <div class="panel active" id="panelOrders">
      <div id="ordersList"><div class="empty-state">還沒有訂單</div></div>
    </div>

    <div class="panel" id="panelInquiries">
      <div id="inquiriesList"><div class="empty-state">還沒有客製詢價</div></div>
    </div>

    <div class="panel" id="panelProducts">
      <div class="product-toolbar">
        <button class="btn btn-outline btn-sm" id="seedProductsBtn">初始化預設商品（僅需一次）</button>
        <button class="btn btn-primary" id="addProductBtn">＋新增商品</button>
      </div>
      <div id="productsList"><div class="empty-state">還沒有商品，點右上角「新增商品」開始吧！</div></div>
    </div>

    <div class="panel" id="panelMessages">
      <div id="threadsList"><div class="empty-state">目前沒有顧客留言</div></div>
    </div>
  </div>
</div>

<!-- 對話視窗 -->
<div class="pf-overlay" id="chatOverlay">
  <div class="pf-card" style="max-width:480px; display:flex; flex-direction:column; padding:0; overflow:hidden;">
    <div style="padding:22px 26px; border-bottom:2px solid rgba(227,212,255,0.6); display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h3 id="chatThreadEmail" style="font-size:1.15rem;"></h3>
      </div>
      <button class="modal-close" id="chatOverlayClose" aria-label="關閉" style="background:none;border:none;font-size:1.3rem;color:var(--ink-soft);cursor:pointer;">✕</button>
    </div>
    <div id="adminChatBox" style="flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:10px; max-height:50vh;"></div>
    <div style="display:flex; gap:8px; padding:16px 20px 20px; border-top:2px solid rgba(227,212,255,0.6);">
      <input type="text" id="adminChatInput" placeholder="輸入回覆..." style="flex:1;padding:11px 16px;border-radius:999px;border:1.5px solid rgba(139,122,151,0.25);font-family:'Noto Sans TC';font-size:0.9rem;">
      <button class="btn btn-primary btn-sm" id="adminChatSendBtn">送出</button>
    </div>
  </div>
</div>

<!-- 新增／編輯商品表單 -->
<div class="pf-overlay" id="pfOverlay">
  <div class="pf-card">
    <h3 id="pfTitle">新增商品</h3>
    <input type="hidden" id="pfKey">

    <div class="pf-field">
      <label>圖示（貼上一個 emoji，例如 🧸 🐰 🔔）</label>
      <input type="text" id="pfIcon" maxlength="4" placeholder="🎁">
      <div class="pf-hint">如果下面有上傳照片，網站會優先顯示照片，這個 emoji 只在沒有照片時當備用圖示。</div>
    </div>
    <div class="pf-field">
      <label>商品照片（選填）</label>
      <input type="file" id="pfImageFile" accept="image/*">
      <div class="pf-hint" id="pfImageHint">建議上傳清楚的商品照片，系統會自動壓縮成適合網頁顯示的大小。</div>
      <div id="pfImagePreviewWrap" style="display:none; margin-top:10px; align-items:center; gap:12px;">
        <img id="pfImagePreview" src="" style="width:72px;height:72px;border-radius:16px;object-fit:cover;box-shadow:0 4px 12px rgba(180,150,200,0.2);">
        <button type="button" class="btn btn-outline btn-sm" id="pfRemoveImageBtn">移除照片</button>
      </div>
      <input type="hidden" id="pfImageData">
    </div>
    <div class="pf-field">
      <label>商品名稱</label>
      <input type="text" id="pfName" placeholder="例如：動物公仔">
    </div>
    <div class="pf-field">
      <label>價格（NT$）</label>
      <input type="number" id="pfPrice" placeholder="例如：480">
    </div>
    <div class="pf-field">
      <label>簡短說明</label>
      <textarea id="pfDesc" rows="2" placeholder="一句話介紹這個商品"></textarea>
    </div>
    <div class="pf-field">
      <label>款式選項（選填）</label>
      <input type="text" id="pfOptions" placeholder="貓咪,狗狗,兔子（逗號或頓號分隔都可以）">
      <div class="pf-hint">留空的話，商品卡片就不會出現款式選單。系統會自動加上「其他」選項。</div>
    </div>
    <div class="pf-field checkbox">
      <input type="checkbox" id="pfActive" checked>
      <label for="pfActive">在網站上顯示這個商品</label>
    </div>

    <div class="pf-actions">
      <button class="btn btn-outline" id="pfCancelBtn">取消</button>
      <button class="btn btn-primary" id="pfSaveBtn">儲存</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCN5mIC4KHO6oCxsl1CxpzGGsGEBEZqVXI",
    authDomain: "obv1rei-shop.firebaseapp.com",
    databaseURL: "https://obv1rei-shop-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "obv1rei-shop",
    storageBucket: "obv1rei-shop.firebasestorage.app",
    messagingSenderId: "555143372361",
    appId: "1:555143372361:web:55be224e2aca2af076a998"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  const loginWrap = document.getElementById('loginWrap');
  const dash = document.getElementById('dash');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginError = document.getElementById('loginError');

  loginBtn.addEventListener('click', () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = '登入中...';
    auth.signInWithEmailAndPassword(email, password)
      .catch(err => {
        loginError.textContent = '登入失敗，請確認 Email 和密碼是否正確';
      })
      .finally(() => {
        loginBtn.disabled = false;
        loginBtn.textContent = '登入';
      });
  });

  logoutBtn.addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged(user => {
    if (user) {
      loginWrap.style.display = 'none';
      dash.classList.add('show');
      loadOrders();
      loadInquiries();
      loadProducts();
      loadThreads();
    } else {
      loginWrap.style.display = 'flex';
      dash.classList.remove('show');
    }
  });

  /* ---- tabs ---- */
  const tabOrders = document.getElementById('tabOrders');
  const tabInquiries = document.getElementById('tabInquiries');
  const tabProducts = document.getElementById('tabProducts');
  const tabMessages = document.getElementById('tabMessages');
  const panelOrders = document.getElementById('panelOrders');
  const panelInquiries = document.getElementById('panelInquiries');
  const panelProducts = document.getElementById('panelProducts');
  const panelMessages = document.getElementById('panelMessages');

  const allTabs = [
    [tabOrders, panelOrders],
    [tabInquiries, panelInquiries],
    [tabProducts, panelProducts],
    [tabMessages, panelMessages]
  ];

  function activateTab(tab, panel) {
    allTabs.forEach(([t, p]) => {
      t.classList.toggle('active', t === tab);
      p.classList.toggle('active', p === panel);
    });
  }

  tabOrders.addEventListener('click', () => activateTab(tabOrders, panelOrders));
  tabInquiries.addEventListener('click', () => activateTab(tabInquiries, panelInquiries));
  tabProducts.addEventListener('click', () => activateTab(tabProducts, panelProducts));
  tabMessages.addEventListener('click', () => activateTab(tabMessages, panelMessages));

  function formatMoney(n) { return 'NT$' + Number(n).toLocaleString(); }
  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  /* ---- orders ---- */
  function loadOrders() {
    db.ref('orders').orderByChild('createdAt').on('value', snapshot => {
      const data = snapshot.val() || {};
      const keys = Object.keys(data).reverse();
      document.getElementById('ordersCount').textContent = keys.length;
      const list = document.getElementById('ordersList');

      if (keys.length === 0) {
        list.innerHTML = '<div class="empty-state">還沒有訂單</div>';
        return;
      }

      list.innerHTML = keys.map(key => {
        const o = data[key];
        const itemsHtml = (o.items || []).map(item => `
          <div class="order-item-row">
            <span class="name">${item.name} × ${item.qty}</span>
            <span class="amt">${formatMoney(item.price * item.qty)}</span>
          </div>
        `).join('');

        const isNew = o.status === '未處理' || !o.status;

        return `
          <div class="order-card">
            <div class="order-card-top">
              <div>
                <div class="order-customer">${o.name || '（未填寫）'}${isNew ? '<span class="badge-new">新</span>' : ''}</div>
                <div class="order-contact">${o.contact || ''}${o.address ? ' ・ ' + o.address : ''}</div>
                <div class="order-time">${formatTime(o.createdAt)}</div>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <select class="status-select ${o.status === '已完成' ? 'done' : ''}" data-key="${key}" data-node="orders">
                  <option value="未處理" ${o.status === '未處理' || !o.status ? 'selected' : ''}>未處理</option>
                  <option value="處理中" ${o.status === '處理中' ? 'selected' : ''}>處理中</option>
                  <option value="已聯絡" ${o.status === '已聯絡' ? 'selected' : ''}>已聯絡</option>
                  <option value="已完成" ${o.status === '已完成' ? 'selected' : ''}>已完成</option>
                </select>
                <button class="btn-danger" data-delete-order="${key}" style="padding:6px 12px;font-size:0.78rem;">刪除</button>
              </div>
            </div>
            <div class="order-items">${itemsHtml}</div>
            <div class="order-total"><span>小計</span><span class="amt">${formatMoney(o.subtotal || 0)}</span></div>
            ${o.note ? `<div class="order-extra"><div><b>備註：</b>${o.note}</div></div>` : ''}
          </div>
        `;
      }).join('');

      list.querySelectorAll('.status-select').forEach(sel => {
        sel.addEventListener('change', () => {
          db.ref(`orders/${sel.dataset.key}/status`).set(sel.value);
        });
      });
      list.querySelectorAll('[data-delete-order]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirm('確定要刪除這筆訂單嗎？此動作無法復原。')) {
            db.ref('orders/' + btn.dataset.deleteOrder).remove();
          }
        });
      });
    });
  }

  /* ---- custom inquiries ---- */
  function loadInquiries() {
    db.ref('customInquiries').orderByChild('createdAt').on('value', snapshot => {
      const data = snapshot.val() || {};
      const keys = Object.keys(data).reverse();
      document.getElementById('inquiriesCount').textContent = keys.length;
      const list = document.getElementById('inquiriesList');

      if (keys.length === 0) {
        list.innerHTML = '<div class="empty-state">還沒有客製詢價</div>';
        return;
      }

      list.innerHTML = keys.map(key => {
        const q = data[key];
        const isNew = q.status === '未回覆' || !q.status;

        return `
          <div class="order-card">
            <div class="order-card-top">
              <div>
                <div class="order-customer">${q.name || '（未填寫）'}${isNew ? '<span class="badge-new">新</span>' : ''}</div>
                <div class="order-contact">${q.contact || ''}${q.email ? ' ・ ' + q.email : ''}</div>
                <div class="order-time">${formatTime(q.createdAt)}</div>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <select class="status-select ${q.status === '已回覆' ? 'replied' : ''}" data-key="${key}" data-node="customInquiries">
                  <option value="未回覆" ${q.status === '未回覆' || !q.status ? 'selected' : ''}>未回覆</option>
                  <option value="已回覆" ${q.status === '已回覆' ? 'selected' : ''}>已回覆</option>
                  <option value="已成交" ${q.status === '已成交' ? 'selected' : ''}>已成交</option>
                </select>
                <button class="btn-danger" data-delete-inquiry="${key}" style="padding:6px 12px;font-size:0.78rem;">刪除</button>
              </div>
            </div>
            <div class="inquiry-desc">${q.description || ''}</div>
            <div class="order-extra">
              ${q.refImage ? (q.refImage.startsWith('data:image')
                ? `<div style="margin:8px 0;"><b>參考圖片：</b><br><img src="${q.refImage}" style="max-width:180px;border-radius:12px;margin-top:6px;box-shadow:0 4px 12px rgba(180,150,200,0.2);cursor:pointer;" onclick="window.open(this.src)"></div>`
                : `<div><b>參考圖片：</b><a href="${q.refImage}" target="_blank" rel="noopener">${q.refImage}</a></div>`) : ''}
              <div><b>尺寸：</b>${q.size || '未選擇'}　<b>顏色：</b>${q.color || '未填寫'}</div>
              <div><b>底座／刻字：</b>${q.base || ''}　<b>用途：</b>${q.purpose || ''}</div>
              ${q.deadline ? `<div><b>希望完成時間：</b>${q.deadline}</div>` : ''}
              ${q.budget ? `<div><b>預算：</b>${q.budget}</div>` : ''}
              ${q.note ? `<div><b>備註：</b>${q.note}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      list.querySelectorAll('.status-select').forEach(sel => {
        sel.addEventListener('change', () => {
          db.ref(`customInquiries/${sel.dataset.key}/status`).set(sel.value);
        });
      });
      list.querySelectorAll('[data-delete-inquiry]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirm('確定要刪除這筆客製詢價紀錄嗎？此動作無法復原。')) {
            db.ref('customInquiries/' + btn.dataset.deleteInquiry).remove();
          }
        });
      });
    });
  }

  /* ---- 商品管理 ---- */
  const productsList = document.getElementById('productsList');
  const pfOverlay = document.getElementById('pfOverlay');
  const pfTitle = document.getElementById('pfTitle');
  const pfKey = document.getElementById('pfKey');
  const pfIcon = document.getElementById('pfIcon');
  const pfName = document.getElementById('pfName');
  const pfPrice = document.getElementById('pfPrice');
  const pfDesc = document.getElementById('pfDesc');
  const pfOptions = document.getElementById('pfOptions');
  const pfActive = document.getElementById('pfActive');
  const pfImageFile = document.getElementById('pfImageFile');
  const pfImageData = document.getElementById('pfImageData');
  const pfImagePreviewWrap = document.getElementById('pfImagePreviewWrap');
  const pfImagePreview = document.getElementById('pfImagePreview');
  const pfRemoveImageBtn = document.getElementById('pfRemoveImageBtn');
  const pfImageHint = document.getElementById('pfImageHint');

  /* 把選好的照片壓縮成適合網頁顯示的小尺寸 base64 圖片 */
  function compressImageFile(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function showImagePreview(dataUrl) {
    pfImageData.value = dataUrl || '';
    if (dataUrl) {
      pfImagePreview.src = dataUrl;
      pfImagePreviewWrap.style.display = 'flex';
    } else {
      pfImagePreview.src = '';
      pfImagePreviewWrap.style.display = 'none';
    }
  }

  pfImageFile.addEventListener('change', async () => {
    const file = pfImageFile.files[0];
    if (!file) return;
    pfImageHint.textContent = '處理照片中...';
    try {
      const dataUrl = await compressImageFile(file, 480, 0.72);
      showImagePreview(dataUrl);
      pfImageHint.textContent = '建議上傳清楚的商品照片，系統會自動壓縮成適合網頁顯示的大小。';
    } catch (err) {
      pfImageHint.textContent = '照片處理失敗，請換一張再試試看。';
    }
    pfImageFile.value = '';
  });

  pfRemoveImageBtn.addEventListener('click', () => showImagePreview(''));

  function loadProducts() {
    db.ref('products').orderByChild('order').on('value', snapshot => {
      const data = snapshot.val() || {};
      const keys = Object.keys(data);
      document.getElementById('productsCount').textContent = keys.length;

      if (keys.length === 0) {
        productsList.innerHTML = '<div class="empty-state">還沒有商品，點右上角「新增商品」開始吧！</div>';
        return;
      }

      productsList.innerHTML = keys.map(key => {
        const p = data[key];
        const optionsText = Array.isArray(p.options) && p.options.length > 0
          ? '款式：' + p.options.join('、')
          : '（無款式選項）';
        return `
          <div class="product-card ${p.active === false ? 'inactive' : ''}">
            <div class="product-icon">${p.image ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;">` : (p.icon || '🎁')}</div>
            <div class="product-info">
              <span class="product-name">${p.name}</span><span class="product-price">${formatMoney(p.price)}</span>
              <div class="product-desc">${p.description || ''}</div>
              <div class="product-options">${optionsText}${p.active === false ? '　・　已下架' : ''}</div>
            </div>
            <div class="product-actions">
              <button class="btn btn-outline btn-sm" data-edit="${key}">編輯</button>
              <button class="btn btn-danger" data-delete="${key}">刪除</button>
            </div>
          </div>
        `;
      }).join('');

      productsList.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => openProductForm(btn.dataset.edit, data[btn.dataset.edit]));
      });
      productsList.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirm('確定要刪除這個商品嗎？此動作無法復原。')) {
            db.ref('products/' + btn.dataset.delete).remove();
          }
        });
      });
    });
  }

  function openProductForm(key, product) {
    pfKey.value = key || '';
    if (product) {
      pfTitle.textContent = '編輯商品';
      pfIcon.value = product.icon || '';
      pfName.value = product.name || '';
      pfPrice.value = product.price || '';
      pfDesc.value = product.description || '';
      pfOptions.value = Array.isArray(product.options) ? product.options.join(',') : '';
      pfActive.checked = product.active !== false;
      showImagePreview(product.image || '');
    } else {
      pfTitle.textContent = '新增商品';
      pfIcon.value = '';
      pfName.value = '';
      pfPrice.value = '';
      pfDesc.value = '';
      pfOptions.value = '';
      pfActive.checked = true;
      showImagePreview('');
    }
    pfOverlay.classList.add('open');
  }

  document.getElementById('addProductBtn').addEventListener('click', () => openProductForm(null, null));
  document.getElementById('pfCancelBtn').addEventListener('click', () => pfOverlay.classList.remove('open'));
  pfOverlay.addEventListener('click', (e) => { if (e.target === pfOverlay) pfOverlay.classList.remove('open'); });

  document.getElementById('pfSaveBtn').addEventListener('click', () => {
    const name = pfName.value.trim();
    const price = parseInt(pfPrice.value, 10);

    if (!name) { alert('請輸入商品名稱'); return; }
    if (!price || price <= 0) { alert('請輸入正確的價格'); return; }

    const options = pfOptions.value.trim()
      ? pfOptions.value.split(/[,，、]+/).map(s => s.trim()).filter(Boolean)
      : [];

    const productData = {
      icon: pfIcon.value.trim() || '🎁',
      image: pfImageData.value || null,
      name,
      price,
      description: pfDesc.value.trim(),
      options,
      active: pfActive.checked
    };

    const key = pfKey.value;
    if (key) {
      db.ref('products/' + key).update(productData).then(() => {
        pfOverlay.classList.remove('open');
      });
    } else {
      productData.order = Date.now();
      productData.createdAt = firebase.database.ServerValue.TIMESTAMP;
      db.ref('products').push(productData).then(() => {
        pfOverlay.classList.remove('open');
      });
    }
  });

  /* ---- 一鍵初始化預設商品（僅在資料庫是空的時候可用） ---- */
  document.getElementById('seedProductsBtn').addEventListener('click', () => {
    db.ref('products').once('value').then(snapshot => {
      if (snapshot.exists()) {
        alert('已經有商品資料了，不會重複匯入。');
        return;
      }
      const now = Date.now();
      const defaults = [
        { icon: '🧸', name: '卡通公仔', price: 450, description: '喜歡的卡通角色，做成桌上的小公仔', options: ['三麗鷗','哆啦A夢','蠟筆小新','吉伊卡哇','小小兵'] },
        { icon: '🔔', name: '吊飾', price: 220, description: '包包、鑰匙圈上的小裝飾，療癒又好看', options: ['愛心吊飾','星星吊飾','英文字母／名字吊飾','動物造型吊飾','花朵吊飾'] },
        { icon: '🐰', name: '動物公仔', price: 480, description: '貓咪、兔子、熊熊⋯各種可愛動物造型', options: ['貓咪','狗狗','兔子','熊熊'] },
        { icon: '🧺', name: '日常生活用品', price: 350, description: '收納盒、掛勾、置物架，讓生活更方便', options: ['筷子架','書架','收納盒','筆筒'] },
        { icon: '🪀', name: '玩具', price: 280, description: '好玩又好看的小玩具，送禮自用都適合', options: ['陀螺','迷你積木','彈跳玩具','扭蛋公仔','益智拼圖'] }
      ];
      const updates = {};
      defaults.forEach((p, i) => {
        const newKey = db.ref('products').push().key;
        updates[newKey] = { ...p, active: true, order: now + i, createdAt: firebase.database.ServerValue.TIMESTAMP };
      });
      db.ref('products').update(updates).then(() => {
        alert('預設商品已匯入！');
      });
    });
  });

  /* ---- 顧客訊息 ---- */
  const threadsList = document.getElementById('threadsList');
  const chatOverlay = document.getElementById('chatOverlay');
  const chatThreadEmail = document.getElementById('chatThreadEmail');
  const adminChatBox = document.getElementById('adminChatBox');
  const adminChatInput = document.getElementById('adminChatInput');
  const adminChatSendBtn = document.getElementById('adminChatSendBtn');
  const chatOverlayClose = document.getElementById('chatOverlayClose');

  let allThreadsData = {};
  let currentThreadUid = null;

  function chatFormatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function loadThreads() {
    db.ref('messages').on('value', snapshot => {
      const data = snapshot.val() || {};
      allThreadsData = data;
      const uids = Object.keys(data);
      document.getElementById('messagesCount').textContent = uids.length;

      if (uids.length === 0) {
        threadsList.innerHTML = '<div class="empty-state">目前沒有顧客留言</div>';
        return;
      }

      const threads = uids.map(uid => {
        const msgs = Object.values(data[uid]);
        msgs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        const last = msgs[msgs.length - 1];
        const email = msgs.find(m => m.email)?.email || '（未知使用者）';
        return { uid, last, email };
      }).sort((a, b) => (b.last.createdAt || 0) - (a.last.createdAt || 0));

      threadsList.innerHTML = threads.map(t => `
        <div class="thread-card" data-uid="${t.uid}">
          <div style="min-width:0;">
            <div class="thread-email">${t.email}</div>
            <div class="thread-preview">${t.last.sender === 'shop' ? '你：' : ''}${t.last.text}</div>
          </div>
          <div class="thread-time">${chatFormatTime(t.last.createdAt)}</div>
        </div>
      `).join('');

      threadsList.querySelectorAll('.thread-card').forEach(card => {
        card.addEventListener('click', () => openThread(card.dataset.uid));
      });

      if (currentThreadUid && chatOverlay.classList.contains('open')) {
        renderThreadMessages(currentThreadUid);
      }
    });
  }

  function openThread(uid) {
    currentThreadUid = uid;
    const msgs = Object.values(allThreadsData[uid] || {});
    const email = msgs.find(m => m.email)?.email || '（未知使用者）';
    chatThreadEmail.textContent = email;
    renderThreadMessages(uid);
    chatOverlay.classList.add('open');
  }

  function renderThreadMessages(uid) {
    const data = allThreadsData[uid] || {};
    const msgs = Object.values(data).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    adminChatBox.innerHTML = msgs.map(m => `
      <div class="admin-bubble ${m.sender === 'shop' ? 'from-shop' : 'from-customer'}">
        ${m.text}
        <span class="chat-time">${chatFormatTime(m.createdAt)}</span>
      </div>
    `).join('');
    adminChatBox.scrollTop = adminChatBox.scrollHeight;
  }

  chatOverlayClose.addEventListener('click', () => { chatOverlay.classList.remove('open'); currentThreadUid = null; });
  chatOverlay.addEventListener('click', (e) => { if (e.target === chatOverlay) { chatOverlay.classList.remove('open'); currentThreadUid = null; } });

  function sendAdminReply() {
    const text = adminChatInput.value.trim();
    if (!text || !currentThreadUid) return;
    adminChatSendBtn.disabled = true;
    db.ref('messages/' + currentThreadUid).push({
      sender: 'shop',
      text,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      adminChatInput.value = '';
    }).finally(() => {
      adminChatSendBtn.disabled = false;
    });
  }

  adminChatSendBtn.addEventListener('click', sendAdminReply);
</script>
